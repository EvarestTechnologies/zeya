      "How should I take care of myself during pregnancy?",
      "What daily care do I need when pregnant?",
      "How much water should I drink in pregnancy?",
      "Should I rest more when pregnant?",
      "Should I sleep under a mosquito net when pregnant?",
      "Should I take iron and folic acid every day?"
    ],
    "answer": "Eat one extra meal every day. Drink plenty of water, at least 8 glasses a day. Take iron and folic acid supplements every day throughout pregnancy. Avoid heavy work and rest more. Sleep under a long-lasting insecticidal net. Do regular gentle exercise.\nSource: MOH Mother and Child Health Handbook."
