      "When should I go to hospital when pregnant?"
    ],
    "answer": "Danger signs in pregnancy: severe headache, looking pale, vaginal bleeding, fever, severe abdominal pain, swelling of the face and hands, reduced or no movement of the baby, breaking water, and convulsions or fits. If you have any of these signs, go to a health facility now.\nSource: MOH Mother and Child Health Handbook."
